<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointment Confirmation | CareFlow</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .confirm-page{min-height:100vh;background:var(--background);padding:24px 16px 60px;display:flex;justify-content:center;align-items:flex-start}
    .confirm-wrap{width:100%;max-width:640px}
    .confirm-card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:32px 28px;box-shadow:0 20px 50px rgba(45,60,52,.06)}
    .confirm-card h1{font-family:Manrope,sans-serif;font-size:clamp(24px,5vw,32px);text-align:left;margin-bottom:6px}
    .confirm-card .subtitle{text-align:left;color:var(--text-secondary);font-size:14px;margin-bottom:24px}
    .details{background:var(--surface-soft);border-radius:14px;padding:18px 20px;margin-bottom:24px;display:flex;flex-direction:column;gap:12px}
    .details .row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;flex-wrap:wrap}
    .details .row span{color:var(--text-secondary)}
    .details .row strong{color:var(--text-primary);text-align:right}
    .available{color:#5f8a68}
    .flow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;padding:14px;background:var(--background);border-radius:12px;border:1px solid var(--border)}
    .step{padding:7px 12px;font-size:11px;border-radius:20px;background:var(--surface);color:var(--text-secondary);border:1px solid var(--border)}
    .step.active{background:#e5ece7;color:var(--sage-dark);font-weight:600;border-color:var(--sage)}
    .step.current{background:var(--sage-dark);color:#fff;font-weight:600;border-color:transparent}
    .buttons{display:flex;gap:12px;flex-wrap:wrap}
    .buttons button{flex:1;min-width:120px;padding:14px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
    .buttons .cancel{background:var(--surface-soft);color:var(--text-secondary)}
    .buttons .confirm{background:var(--sage-dark);color:#fff}
    .buttons .confirm:disabled{opacity:.65;cursor:not-allowed}
    #confirmMessage{display:none;margin-top:16px;padding:12px;border-radius:10px;font-size:13px;font-weight:600}
    @media(max-width:480px){.confirm-card{padding:22px 16px}.buttons{flex-direction:column}}
  </style>
</head>
<body class="confirm-page">
  <div class="confirm-wrap">
    <div class="confirm-card">
      <h1>Appointment Confirmation</h1>
      <p class="subtitle">Review your details before confirming.</p>
      <div class="details">
        <div class="row"><span>Doctor</span><strong id="cDoctor">—</strong></div>
        <div class="row"><span>Department</span><strong id="cDept">—</strong></div>
        <div class="row"><span>Date</span><strong id="cDate">—</strong></div>
        <div class="row"><span>Time</span><strong id="cTime">—</strong></div>
        <div class="row"><span>Consultation</span><strong>In-Person Visit</strong></div>
        <div class="row"><span>Slot status</span><strong class="available">Available</strong></div>
        <div class="row"><span>Reason</span><strong id="cReason">—</strong></div>
      </div>
      <div class="flow">
        <div class="step active">Select Doctor</div>
        <div class="step active">Select Date & Time</div>
        <div class="step current">Confirm</div>
        <div class="step">Generate Queue #</div>
        <div class="step">Appointment Created</div>
      </div>
      <div class="buttons">
        <button type="button" class="cancel" id="cancelBtn">Cancel</button>
        <button type="button" class="confirm" id="confirmBtn">Confirm Appointment</button>
      </div>
      <div id="confirmMessage"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const session = await requirePatientAuth();
      if (!session) return;
      const raw = sessionStorage.getItem("careflow_pending_appt");
      if (!raw) { window.location.href = "book-appointment.html"; return; }
      let pending;
      try { pending = JSON.parse(raw); } catch { window.location.href = "book-appointment.html"; return; }
      const dateDisplay = pending.appointment_date
        ? new Date(pending.appointment_date + "T00:00:00").toLocaleDateString("en-US", { day: "numeric", month: "long", year: "numeric" })
        : pending.appointment_date;
      document.getElementById("cDoctor").textContent = "Dr. " + (pending.doctor_name || "—");
      document.getElementById("cDept").textContent = pending.department || "—";
      document.getElementById("cDate").textContent = dateDisplay;
      document.getElementById("cTime").textContent = pending.time_slot || "—";
      document.getElementById("cReason").textContent = pending.reason || "—";
      const msg = document.getElementById("confirmMessage");
      const btn = document.getElementById("confirmBtn");
      function showMsg(text, type) {
        msg.style.display = "block"; msg.textContent = text;
        msg.style.background = type === "error" ? "#f8d7da" : "#d4edda";
        msg.style.color = type === "error" ? "#721c24" : "#155724";
        msg.style.border = "1px solid " + (type === "error" ? "#f5c6cb" : "#c3e6cb");
      }
      document.getElementById("cancelBtn").addEventListener("click", () => {
        sessionStorage.removeItem("careflow_pending_appt");
        window.location.href = "book-appointment.html";
      });
      btn.addEventListener("click", async () => {
        btn.disabled = true; btn.textContent = "Confirming…";
        let queueNumber = 1;
        const { count } = await supabase.from("appointments").select("*", { count: "exact", head: true })
          .eq("appointment_date", pending.appointment_date).eq("doctor_id", pending.doctor_id);
        if (typeof count === "number") queueNumber = count + 1;
        const { data, error } = await supabase.from("appointments").insert({
          patient_id: session.user.id,
          doctor_id: pending.doctor_id,
          department: pending.department || "General",
          appointment_date: pending.appointment_date,
          time_slot: pending.time_slot,
          reason: pending.reason || "",
          status: "booked",
          queue_number: queueNumber
        }).select("id, queue_number").single();
        if (error) {
          showMsg("Could not create appointment: " + error.message, "error");
          btn.disabled = false; btn.textContent = "Confirm Appointment"; return;
        }
        sessionStorage.removeItem("careflow_pending_appt");
        showMsg("Appointment confirmed! Queue number: " + String(data.queue_number).padStart(2, "0"), "success");
        setTimeout(() => { window.location.href = "today-queue.html"; }, 1200);
      });
    });
  </script>
</body>
</html>
