<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Today's Queue | CareFlow</title>

    <link rel="stylesheet" href="today-queue.css">

</head>

<body>

<header class="queue-header">

    <div class="logo">
        <div class="logo-mark">+</div>
        <div class="logo-name">Care<span>Flow</span></div>
    </div>

    <div class="doctor-profile">
        Dr. Sharma
    </div>

</header>


<main class="queue-dashboard">

    <section class="current-patient">

        <h1>Today's Queue</h1>

        <h2>Current Patient</h2>

        <div class="current-card">

            <div class="queue-number">
                Queue No. <span>01</span>
            </div>

            <p><strong>Patient:</strong> Rahul Das</p>

            <p><strong>Doctor:</strong> Dr. Sharma</p>

            <p>
                <strong>Status:</strong>
                <span class="waiting-status">WAITING</span>
            </p>

            <button class="call-btn">
                Call Next Patient
            </button>

        </div>

    </section>


    <section class="waiting-queue">

        <h2>Waiting Queue</h2>

        <div class="queue-table">

            <div class="queue-row">

                <div>01</div>

                <div>Patient A</div>

                <div class="status waiting">
                    Waiting
                </div>

            </div>

            <div class="queue-row">

                <div>02</div>

                <div>Patient B</div>

                <div class="status waiting">
                    Waiting
                </div>

            </div>

            <div class="queue-row">

                <div>03</div>

                <div>Patient C</div>

                <div class="status waiting">
                    Waiting
                </div>

            </div>

            <div class="queue-row">

                <div>04</div>

                <div>Patient D</div>

                <div class="status waiting">
                    Waiting
                </div>

            </div>

        </div>

    </section>

</main>

</body>

</html>
